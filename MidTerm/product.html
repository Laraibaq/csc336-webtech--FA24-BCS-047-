
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyStore - Product</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <nav class="navbar navbar-expand-md site-nav">
      <div class="container">

        <a class="navbar-brand brand-logo" href="index.html">MyStore</a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#main-menu"
                aria-controls="main-menu" aria-expanded="false"
                aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="main-menu">

          <ul class="navbar-nav nav-links">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Men</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Women</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
          </ul>

          <a class="nav-link cart-link" href="checkout.html">
            🛒 Cart (<span id="cart-count">0</span>)
          </a>

        </div>
      </div>
    </nav>
  </header>

  <main class="site-main container">
    <section class="product-detail row g-4">

      <div class="col-12 col-md-6">
        <img class="product-detail-image" src="https://placehold.co/600x600" alt="Product 1">
      </div>

      <div class="col-12 col-md-6">
        <h1 class="product-detail-name">Product 1</h1>
        <p class="product-detail-price">Rs. 2,000</p>
        <p class="product-detail-description">
          A comfortable everyday item made from soft fabric. Easy to wash
          and available in many sizes.
        </p>

        <label class="quantity-label" for="quantity">Quantity</label>
        <input class="quantity-input" type="number" id="quantity"
               name="quantity" value="1" min="1">

        <button class="add-to-cart-btn" type="button">Add to Cart</button>
      </div>

    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-columns">
        <div>
          <h2 class="footer-title">MyStore</h2>
          <p>Simple clothes for everyone.</p>
        </div>
        <div>
          <h2 class="footer-title">Shop</h2>
          <ul class="footer-links">
            <li><a href="#">Men</a></li>
            <li><a href="#">Women</a></li>
          </ul>
        </div>
        <div>
          <h2 class="footer-title">Help</h2>
          <ul class="footer-links">
            <li><a href="#">Contact</a></li>
            <li><a href="#">Returns</a></li>
          </ul>
        </div>
      </div>
      <p class="footer-copy">© 2026 MyStore</p>
    </div>
  </footer>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>
</body>
</html>
